# Sert le build statique du frontend ET fait office de reverse-proxy vers
# l'API — le navigateur n'a besoin de connaître qu'UNE seule origine (celle
# de ce serveur Nginx). "api" (nom du service Docker Compose) n'est résolu
# QUE côté serveur, à l'intérieur du réseau Docker — jamais exposé au
# navigateur de l'utilisateur.
server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API FastAPI — proxy transparent, chemin conservé tel quel.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Génération du rapport PDF / entraînement Prophet peuvent prendre
        # plusieurs dizaines de secondes — aligné sur le timeout du client
        # HTTP frontend (cf. src/api/client.js, TIMEOUT_LONG = 120s).
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Fichiers statiques buildés (JS/CSS/images) — cache long, noms de
    # fichiers hashés par Vite donc invalidation automatique au déploiement.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (React Router gère
    # la navigation côté client) — jamais de 404 Nginx sur un rafraîchissement
    # de page type /segmentation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
