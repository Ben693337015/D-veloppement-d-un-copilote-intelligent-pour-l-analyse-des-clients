# Sert le build statique du frontend ET fait office de reverse-proxy vers
# l'API — le navigateur n'a besoin de connaître qu'UNE seule origine (celle
# de ce serveur Nginx). "api" (nom du service Docker Compose) n'est résolu
# QUE côté serveur, à l'intérieur du réseau Docker — jamais exposé au
# navigateur de l'utilisateur.
server {
    listen 8501;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BUG CORRIGÉ : sans cette directive, Nginx applique sa limite par
    # défaut de 1 Mo au corps des requêtes et renvoie "413 Request Entity
    # Too Large" AVANT même que l'API ne voie le fichier — un export de
    # ventes réel (7 Mo pour 60 000 lignes) était donc refusé alors que
    # l'API accepte jusqu'à 50 Mo (app/routers/ingestion.py,
    # _MAX_UPLOAD_BYTES). Marge de 1 Mo pour l'enveloppe multipart.
    client_max_body_size 51m;

    # API FastAPI — proxy transparent, chemin conservé tel quel.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Génération du rapport PDF / entraînement Prophet peuvent prendre
        # plusieurs dizaines de secondes — aligné sur le timeout du client
        # HTTP frontend (cf. src/api/client.js, TIMEOUT_LONG = 120s).
        proxy_read_timeout 120s;
    }

    # Imports de fichiers : un import de plusieurs dizaines de milliers de
    # lignes + recalcul automatique de la segmentation RFM peut dépasser
    # 120 s (mesuré : ~55 s pour 60 000 lignes sur SQLite, davantage sur
    # PostgreSQL). Délai dédié, aligné sur TIMEOUT_IMPORT de src/api/client.js.
    location /api/v1/ingestion/ {
        proxy_pass http://api:8000/api/v1/ingestion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Pipeline RFM en mode « auto » (3 algorithmes évalués) : peut dépasser
    # 120 s sur une grosse base ou une machine lente. Même délai que les imports.
    location /api/v1/marketing/rfm/ {
        proxy_pass http://api:8000/api/v1/marketing/rfm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://api:8000/health;
    }

    # Fichiers statiques buildés (JS/CSS/images) — cache long, noms de
    # fichiers hashés par Vite donc invalidation automatique au déploiement.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (React Router gère
    # la navigation côté client) — jamais de 404 Nginx sur un rafraîchissement
    # de page type /segmentation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
